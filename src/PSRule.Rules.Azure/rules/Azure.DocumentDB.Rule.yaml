#
# Validation rules for Azure DocumentDB

#region Rules

---
# Synopsis: Azure DocumentDB clusters should have Microsoft Entra ID authentication enabled.
apiVersion: github.com/microsoft/PSRule/v1
kind: Rule
metadata:
  name: Azure.DocumentDB.EntraID
  ref: AZR-000499
  alias:
    - Azure.Cosmos.MongoEntraID
  tags:
    release: GA
    ruleSet: 2025_12
    Azure.WAF/pillar: Security
  labels:
    Azure.MCSB.v1/control: ['IM-1', 'IM-3']
    Azure.WAF/maturity: L1
spec:
  type:
    - Microsoft.DocumentDB/mongoClusters
  condition:
    field: properties.authConfig.allowedModes[*]
    contains: MicrosoftEntraID

#endregion Rules
